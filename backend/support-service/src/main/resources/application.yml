spring:
  application:
    name: support-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/order_support}
    username: ${SPRING_DATASOURCE_USERNAME:order_support}
    password: ${SPRING_DATASOURCE_PASSWORD:order_support}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    table: support_flyway_schema_history
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:order_support}
    password: ${RABBITMQ_PASSWORD:order_support}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
security:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-before-deploying}
services:
  order:
    url: ${ORDER_SERVICE_URL:http://localhost:8081}
server:
  port: ${SERVER_PORT:8082}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
