spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/order_support}}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:order_support}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:order_support}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:order_support}
    password: ${RABBITMQ_PASSWORD:order_support}

security:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-before-deploying}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
