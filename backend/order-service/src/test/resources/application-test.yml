spring:
  datasource:
    url: jdbc:h2:mem:order_support;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
security:
  jwt:
    secret: test-secret-must-be-at-least-thirty-two-characters-long
orders:
  outbox:
    retry-enabled: false
