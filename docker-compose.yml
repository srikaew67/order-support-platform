services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-order_support}
      POSTGRES_USER: ${POSTGRES_USER:-order_support}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-order_support}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-order_support} -d ${POSTGRES_DB:-order_support}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-order_support}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-order_support}
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  order-service:
    image: order-support/order-service:${IMAGE_TAG:-local}
    build:
      context: ./backend/order-service
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-order_support}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-order_support}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-order_support}
      JWT_SECRET: ${JWT_SECRET:?Set a private JWT_SECRET in .env or the shell before starting Compose}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-order_support}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-order_support}
    ports:
      - "${ORDER_HOST_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  support-service:
    image: order-support/support-service:${IMAGE_TAG:-local}
    build:
      context: ./backend/support-service
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-order_support}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-order_support}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-order_support}
      JWT_SECRET: ${JWT_SECRET:?Set a private JWT_SECRET in .env or the shell before starting Compose}
      ORDER_SERVICE_URL: http://order-service:8081
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-order_support}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-order_support}
    ports:
      - "${SUPPORT_HOST_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  notification-service:
    image: order-support/notification-service:${IMAGE_TAG:-local}
    build:
      context: ./backend/notification-service
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-order_support}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-order_support}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-order_support}
      JWT_SECRET: ${JWT_SECRET:?Set a private JWT_SECRET in .env or the shell before starting Compose}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-order_support}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-order_support}
    ports:
      - "${NOTIFICATION_HOST_PORT:-8083}:8083"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  frontend:
    image: order-support/frontend:${IMAGE_TAG:-local}
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:80"
    depends_on:
      order-service:
        condition: service_healthy
      support-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy

volumes:
  postgres-data:
